<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>留言審核｜小鴨製造所</title><style>body{font:17px system-ui;max-width:850px;margin:40px auto;padding:20px;background:#f7f6f1;color:#172d32}button,input,select{font:inherit;padding:10px;border:1px solid #81969a;border-radius:5px}button{cursor:pointer;background:#dce9e4}article{padding:20px 0;border-bottom:1px solid #aaa}.body{white-space:pre-wrap;overflow-wrap:anywhere}form{display:flex;gap:12px;flex-wrap:wrap}input{max-width:100%;width:400px}a{color:#247b75}#notice{min-height:2em}button:disabled{opacity:.5}small{font-size:14px}</style><h1>留言審核</h1><p>待審留言只有管理者能看到。公開後才會出現在文章下方；移除會先隱藏，仍可重新公開。</p><form id="login"><label>管理金鑰 <input type="password" id="key" autocomplete="off" required></label><button>開啟待審清單</button></form><div id="controls" hidden><label>狀態 <select id="status"><option value="pending">待審</option><option value="approved">已公開</option><option value="hidden">已移除</option></select></label> <button id="refresh">重新整理</button> <button id="logout">登出</button></div><p id="notice" role="status"></p><div id="rows"></div><button id="more" hidden>較早留言</button><p><small>金鑰只保留在此頁面的記憶體中，重新整理或關閉後需再輸入。<a href="/">回網站</a></small></p><script src="/moderation.js" defer></script></html>
